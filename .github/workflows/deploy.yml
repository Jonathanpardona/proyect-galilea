name: Deploy Suite Clínica Galilea

on:
  push:
    branches:
      - claude/review-sampling-project-ECMRt
      - claude/zealous-hamilton-vJSDJ
      - claude/brave-goodall-fvbtby

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: suite-clinica-galilea/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: suite-clinica-galilea

      - name: Build
        run: npm run build
        working-directory: suite-clinica-galilea

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: suite-clinica-galilea/dist

      - uses: actions/deploy-pages@v4
        id: deployment
